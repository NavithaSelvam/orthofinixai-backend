services:
  - type: web
    name: orthofinix-ai-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: BASE_URL
        value: "https://orthofinixai-backend.onrender.com"
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false # Set this in Render dashboard
